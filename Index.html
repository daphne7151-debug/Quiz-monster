<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>퀴즈 몬스터</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1633;--panel:#272163;--panel2:#1c1752;--line:#4b43a8;--text:#f5f3ff;--muted:#b9b3ee;--p1:#3b8cff;--p2:#ff4d6d;--gold:#ffd23f;--ok:#27b564;--bad:#e2455a;--cream:#fff8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px);background:#0e0c2b}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--text);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:radial-gradient(1100px 560px at 50% -8%,#3b30a0 0,transparent 62%),linear-gradient(#1b1650,#0e0c2b) fixed;-webkit-tap-highlight-color:transparent}
main{max-width:1080px;margin:0 auto;padding:12px 12px 40px}
.hidden{display:none!important}
button,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,.jua{font-family:Jua,"Noto Sans KR",sans-serif;font-weight:400}
.hero{text-align:center;padding:14px 0 8px}
.hero h1{margin:0;font-size:clamp(38px,9vw,70px);line-height:1.05;color:var(--gold);-webkit-text-stroke:8px #2a1b78;paint-order:stroke fill;text-shadow:0 6px 0 #2a1b78;letter-spacing:1px}
.hero p{margin:12px auto 0;max-width:520px;color:var(--muted);font-size:15px;line-height:1.55;text-wrap:balance}
.card{background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 5px 0 rgba(0,0,0,.28);margin-top:12px;min-width:0}
.card h2{margin:0 0 10px;font-size:22px}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc.k0{border-color:var(--p1)}.pc.k1{border-color:var(--p2)}
.pc.k0 h2{color:#8ec1ff}.pc.k1 h2{color:#ff9fb0}
.roster{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rc{background:var(--panel2);border:3px solid transparent;border-radius:14px;padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px}
.rc small{font-size:11px;color:var(--muted);line-height:1.2;text-align:center}
.rc.sel{border-color:var(--gold);background:#3a3290}.rc.sel small{color:#fff}
.th{width:100%;max-width:74px;aspect-ratio:1}.th svg{width:100%;height:100%;display:block;overflow:visible}
.evo{display:flex;align-items:flex-end;justify-content:center;gap:2px;margin:12px 0 6px;background:var(--panel2);border-radius:14px;padding:8px 4px}
.ef{flex:1;text-align:center;min-width:0}.ef .th{margin:0 auto;max-width:78px}.ef small{display:block;font-size:11px;line-height:1.2;color:var(--muted)}
.ar{color:var(--gold);font-family:Jua;font-size:22px;padding-bottom:22px}
.mv{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:13px;color:var(--muted);align-items:center}.mv b{color:#fff}
.tpb{display:inline-block;border-radius:99px;padding:2px 10px;font-family:Jua;font-size:13px;color:#fff;border:2px solid var(--ink)}
.tpb.fire{background:#f0642f}.tpb.water{background:#2d7dff}.tpb.grass{background:#3aa655}.tpb.electric{background:#e0a400;color:#2b1d3f}.tpb.ice{background:#4cb6e8}.tpb.psychic{background:#a35ee0}
.hpl{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:700;font-size:14px}
.hpl select{flex:1;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:9px 10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs button{font-family:Jua;font-size:18px;padding:10px;border-radius:14px;border:3px solid var(--line);background:var(--panel2);color:var(--muted)}
.tabs button.on[data-t="0"]{background:var(--p1);border-color:#8ec1ff;color:#fff}.tabs button.on[data-t="1"]{background:var(--p2);border-color:#ff9fb0;color:#fff}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 4px}.presets span{font-size:13px;color:var(--muted);margin-right:2px}
.presets button,.mini{background:var(--panel2);border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
.presets button:hover,.mini:hover{border-color:var(--gold)}
.sum{font-size:13px;color:var(--muted);margin:8px 2px}.sum b{color:var(--gold)}
.cat{background:var(--panel2);border-radius:14px;margin-top:8px;overflow:hidden}
.cat summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;font-size:16px}
.cat summary::-webkit-details-marker{display:none}
.cat summary b{font-family:Jua;font-weight:400;font-size:19px}
.cat summary em{margin-left:auto;font-style:normal;font-size:13px;color:var(--muted);background:#120e3a;border-radius:99px;padding:2px 10px}
.cat summary em.has{color:#2b1d3f;background:var(--gold);font-weight:700}
.cat summary:after{content:"›";font-family:Jua;font-size:22px;color:var(--muted);transition:transform .2s}
.cat[open] summary:after{transform:rotate(90deg)}
.srow{display:grid;grid-template-columns:24px 50px 1fr;gap:1px 8px;align-items:center;padding:9px 12px;border-top:1px solid #3a3390;cursor:pointer}
.srow.on{background:#322a82}
.srow input{width:20px;height:20px;accent-color:var(--gold);margin:0}
.stp{font-family:Jua;font-size:13px;color:#2b1d3f;background:var(--gold);border-radius:8px;padding:1px 0;text-align:center}
.lb{font-size:14px;font-weight:700}
.ex{grid-column:3;font-size:13px;color:var(--muted)}
.go{display:block;width:100%;margin-top:16px;padding:16px;font-family:Jua;font-size:28px;color:#3a1f00;background:linear-gradient(#ffe066,#ff9f1c);border:4px solid var(--ink);border-bottom-width:8px;border-radius:20px}
.go:active{transform:translateY(4px);border-bottom-width:4px}
.note{margin:14px 4px 0;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
.toast{color:#ffb4c0;font-weight:700;text-align:center;margin-top:10px;min-height:1.4em;font-size:14px}
.bar{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}
.bar b{font-family:Jua;font-weight:400;font-size:20px}
.bar .r{display:flex;gap:6px;align-items:center}
.bar button{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:7px 11px;font-size:13px;font-weight:700}
#clock{font-family:Jua;color:var(--gold);font-size:18px}
/* ===== 전투 무대 ===== */
.stage{position:relative;overflow:hidden;width:100%;aspect-ratio:16/10;max-height:470px;border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.32);--sky1:#5fc3ff;--sky2:#dff6ff;--hill:#7ed591;--f1:#62c874;--f2:#46ab5d;--pl1:#b4e89c;--pl2:#72c473;--orb:#fff6b0}
.stage[data-theme=dusk]{--sky1:#ff8a6b;--sky2:#ffe3b0;--hill:#88a56f;--f1:#6fa86b;--f2:#4f8a58;--pl1:#bcd98f;--pl2:#78ae70;--orb:#fff0c2}
.stage[data-theme=night]{--sky1:#161a5c;--sky2:#5d4cab;--hill:#2e6b69;--f1:#3b806e;--f2:#2a6458;--pl1:#82d1ae;--pl2:#418f7b;--orb:#f4f1ff}
.sky{position:absolute;inset:0;background:linear-gradient(var(--sky1),var(--sky2) 64%)}
.stage[data-theme=night] .sky{background:radial-gradient(2px 2px at 14% 22%,#fff,transparent),radial-gradient(2px 2px at 30% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 68% 18%,#fff,transparent),radial-gradient(2px 2px at 84% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 52% 9%,#fff,transparent),linear-gradient(var(--sky1),var(--sky2) 64%)}
.sky:after{content:"";position:absolute;left:50%;top:9%;width:clamp(30px,7%,56px);aspect-ratio:1;margin-left:-3.5%;border-radius:50%;background:var(--orb);box-shadow:0 0 36px var(--orb)}
.hills{position:absolute;left:-5%;right:-5%;bottom:36%;height:22%;background:radial-gradient(ellipse 28% 100% at 16% 100%,var(--hill) 0 99%,transparent),radial-gradient(ellipse 36% 125% at 60% 100%,var(--hill) 0 99%,transparent),radial-gradient(ellipse 22% 80% at 94% 100%,var(--hill) 0 99%,transparent)}
.field{position:absolute;left:0;right:0;bottom:0;height:42%;background:repeating-linear-gradient(100deg,transparent 0 46px,rgba(255,255,255,.07) 46px 92px),linear-gradient(var(--f1),var(--f2))}
.hpbox{position:absolute;top:10px;width:min(47%,330px);z-index:4;color:var(--ink);background:var(--cream);border:3px solid var(--ink);border-left:11px solid var(--pc);border-radius:14px;padding:5px 9px 6px;box-shadow:0 4px 0 rgba(0,0,0,.25);font-family:Jua}
#box0{left:10px;--pc:var(--p1)}#box1{right:10px;--pc:var(--p2)}
.hr1{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:clamp(13px,3.3vw,19px);line-height:1.2}
.hr1 .mn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hr1 .lv{font-size:.85em;white-space:nowrap}
.hr2{display:flex;align-items:center;gap:6px;margin-top:3px}
.hr2 .tpb{font-size:10px;padding:0 7px;border-width:1.5px}
.tag{background:#ff8a3d;color:#fff;border-radius:6px;font-size:11px;padding:0 5px;line-height:1.5}
.hb{flex:1;height:11px;border:2px solid var(--ink);border-radius:8px;background:#e6dfc9;overflow:hidden}
.hb i{display:block;height:100%;width:100%;background:linear-gradient(#7af09a,#2fbf62);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hb i.mid{background:linear-gradient(#ffe45e,#f2b705)}.hb i.lo{background:linear-gradient(#ff8a8a,#e53935)}
.hn{text-align:right;font-size:12px;line-height:1.2}
.xb{height:5px;border-radius:4px;background:#d8cfae;margin-top:2px;overflow:hidden}.xb i{display:block;height:100%;width:0;background:#4aa8ff;transition:width .5s}
.mon{position:absolute;aspect-ratio:1;width:calc(var(--w,30%)*var(--k,1));pointer-events:none}
.plat{position:absolute;left:50%;bottom:1%;width:118%;height:22%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at 50% 40%,var(--pl1),var(--pl2));box-shadow:0 5px 0 rgba(0,0,0,.2),inset 0 -4px 0 rgba(0,0,0,.12)}
.fig{position:absolute;inset:0;transform-origin:50% 90%;animation:bob 2.6s ease-in-out infinite}
.sprite{position:absolute;inset:0}.sprite svg{width:100%;height:100%;overflow:visible;display:block;transform-origin:50% 90%;transform:scale(var(--sc,1));transition:transform .4s;filter:drop-shadow(0 6px 3px rgba(0,0,0,.25))}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.flk{transform-box:fill-box;transform-origin:50% 100%;animation:flk .5s ease-in-out infinite alternate}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes flk{from{transform:scale(1,.92) rotate(-3deg)}to{transform:scale(1.06,1.08) rotate(3deg)}}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3%) scale(1.015,.985)}}
.fig.lunge{animation:lunge .6s cubic-bezier(.3,.7,.3,1)}
.fig.hit{animation:hitk .55s}
.fig.faint{animation:faint 1.2s forwards}
.fig.win{animation:win .7s ease-in-out infinite alternate}
.fig.evolve{animation:evo 1.5s}
@keyframes lunge{0%{transform:translateX(0)}30%{transform:translateX(calc(var(--dir)*-6%)) scale(.95,1.05)}55%{transform:translateX(calc(var(--dir)*20%)) scale(1.08)}100%{transform:translateX(0)}}
@keyframes hitk{0%{transform:none;filter:none}12%{transform:translateX(calc(var(--dir)*-9%)) rotate(calc(var(--dir)*-7deg));filter:brightness(2.6) saturate(.3)}28%{transform:translateX(calc(var(--dir)*3%));filter:none}44%{transform:translateX(calc(var(--dir)*-5%));filter:brightness(1.8)}62%{transform:translateX(calc(var(--dir)*2%));filter:none}100%{transform:none}}
@keyframes faint{0%{transform:none;opacity:1}25%{transform:translateY(-6%) rotate(calc(var(--dir)*-10deg))}100%{transform:translateY(46%) rotate(calc(var(--dir)*-82deg)) scale(.7);opacity:0}}
@keyframes win{from{transform:translateY(0)}to{transform:translateY(-13%) scale(1.05)}}
@keyframes evo{0%{filter:none;transform:scale(1)}14%{filter:brightness(0) invert(1) drop-shadow(0 0 10px #fff);transform:scale(.92)}30%{filter:brightness(0) invert(1) drop-shadow(0 0 16px #fff);transform:scale(1.08)}46%{filter:brightness(0) invert(1) drop-shadow(0 0 24px #fff);transform:scale(.94)}62%{filter:brightness(0) invert(1) drop-shadow(0 0 40px #fff);transform:scale(1.4)}82%{filter:brightness(2.2);transform:scale(1.1)}100%{filter:none;transform:scale(1)}}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
#flash{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0}
#flash.go{animation:fl .55s ease-out}
@keyframes fl{0%{opacity:.8}100%{opacity:0}}
.stage.shake{animation:shk .35s}.stage.shake2{animation:shk2 .65s}
@keyframes shk{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
@keyframes shk2{10%{transform:translate(-8px,4px)}25%{transform:translate(8px,-4px)}40%{transform:translate(-7px,3px)}55%{transform:translate(6px,-3px)}70%{transform:translate(-4px,2px)}85%{transform:translate(3px,-1px)}}
.dmg{position:absolute;z-index:7;font-family:Jua;font-size:clamp(26px,6vw,44px);color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;pointer-events:none;animation:dm 1s ease-out forwards;white-space:nowrap}
.dmg.crit{color:var(--gold);font-size:clamp(34px,8vw,58px)}.dmg.self{color:#ffa0a0}
@keyframes dm{0%{opacity:0;transform:translate(-50%,0) scale(.4)}15%{opacity:1;transform:translate(-50%,-30%) scale(1.3)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-150%) scale(1)}}
.bn{position:absolute;left:4%;right:4%;top:38%;z-index:8;text-align:center;font-family:Jua;font-size:clamp(22px,6vw,46px);line-height:1.15;color:#fff7c2;-webkit-text-stroke:7px var(--bc,#7a2bd6);paint-order:stroke fill;pointer-events:none;animation:bn 1.4s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes bn{0%{opacity:0;transform:scale(.3)}18%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
/* ===== 문제 패널 ===== */
.arena{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pp{--pc:var(--p1);background:var(--panel);border:3px solid var(--pc);border-radius:20px;padding:10px;min-width:0;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.pp.k1{--pc:var(--p2)}
.pp header{display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:Jua;font-size:17px}
.chip{background:#120e3a;border-radius:99px;padding:3px 10px;font-family:"Noto Sans KR",sans-serif;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q{font-family:Jua;text-align:center;font-size:clamp(26px,5.6vw,46px);padding:12px 2px 10px;min-height:2.5em;display:flex;align-items:center;justify-content:center;line-height:1.3;text-wrap:balance}
.q.s{font-size:clamp(17px,3.6vw,26px);line-height:1.45}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans.one{grid-template-columns:1fr}
.ans button{font-family:Jua;font-size:clamp(20px,5vw,30px);min-height:56px;color:#fff;background:#3b34a6;border:3px solid var(--ink);border-bottom-width:6px;border-radius:14px;padding:4px 6px;transition:transform .08s;line-height:1.1}
.ans button:active{transform:translateY(3px);border-bottom-width:3px}
.ans button.ok{background:var(--ok)}.ans button.no{background:var(--bad)}.ans button.dim{opacity:.5}
.msg{min-height:2.9em;margin-top:8px;font-size:13px;font-weight:700;text-align:center;color:#ffe9a8;line-height:1.45}
.foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted)}
.gauge{display:inline-flex;gap:4px;align-items:center}.gauge i{width:15px;height:15px;border-radius:50%;background:#120e3a;border:2px solid #5b52c4;transition:all .2s}.gauge i.on{background:var(--gold);border-color:#fff;box-shadow:0 0 8px var(--gold)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.82em;margin:0 .12em}
.fr i{font-style:normal;padding:0 .2em}.fr i:first-child{border-bottom:.09em solid currentColor}
.wh{font-weight:400;margin-right:.04em}
.log{font-size:13px;line-height:1.8;color:var(--muted)}.log div:first-child{color:#fff;font-weight:700}
/* ===== 결과 ===== */
#result{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:14px;overflow:auto;background:rgba(12,9,44,.8);backdrop-filter:blur(4px)}
#conf{position:fixed;inset:0;pointer-events:none}
.rcard{position:relative;width:min(540px,100%);background:var(--panel);border:4px solid var(--gold);border-radius:24px;padding:18px;text-align:center;box-shadow:0 0 50px rgba(255,210,63,.3)}
.rcard h2{margin:0;font-size:clamp(28px,7vw,40px);color:var(--gold)}
.rcard .big{width:150px;margin:6px auto 0;aspect-ratio:1;position:relative}.rcard .big svg{width:100%;height:100%;overflow:visible}
.rcard .big .fig{animation:win .6s ease-in-out infinite alternate}
.rcard p{margin:4px 0 10px;color:var(--muted);font-size:14px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px;text-align:left}
.stat div{background:var(--panel2);border-radius:14px;padding:10px;font-size:13px;line-height:1.7;border:2px solid transparent}
.stat div.w{border-color:var(--gold)}.stat b{font-family:Jua;font-weight:400;font-size:15px;display:block}
.rbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rbtn button{font-family:Jua;font-size:19px;padding:13px 8px;border-radius:16px;border:3px solid var(--ink);border-bottom-width:6px;background:#3b34a6;color:#fff}
.rbtn button.p{background:linear-gradient(#ffe066,#ff9f1c);color:#3a1f00}
@media(max-width:640px){main{padding:8px 8px 36px}.stage{aspect-ratio:5/4;--k:1.2}.stage[data-n="2"]{aspect-ratio:1/1}.stage[data-n="3"]{aspect-ratio:1/1.05;--k:1.12}.arena{gap:6px}.pp{padding:7px;border-radius:16px}.pp header{font-size:15px}.msg{font-size:12px}.card{padding:12px}.srow{grid-template-columns:24px 46px 1fr}}
@media(max-width:380px){.roster{grid-template-columns:repeat(3,1fr)}.hr2 .tpb{display:none}}
@media(prefers-reduced-motion:reduce){.fig,.blink,.flk{animation:none}}

/* ===== v4: 팀 대결 · 옆모습 ===== */
.stage{--k:1}.stage[data-n="2"]{aspect-ratio:16/10}.stage[data-n="3"]{aspect-ratio:3/2}
.world{position:absolute;inset:0;z-index:2}
.mon.r .sprite{transform:scaleX(-1)}.mon.t0{--pc:var(--p1)}.mon.t1{--pc:var(--p2)}
.np{position:absolute;left:50%;bottom:92%;transform:translateX(-50%);width:max(150%,108px);color:var(--ink);background:var(--cream);border:3px solid var(--ink);border-left:8px solid var(--pc);border-radius:12px;padding:3px 6px 4px;box-shadow:0 3px 0 rgba(0,0,0,.25);font-family:Jua;font-size:clamp(9px,2.4vw,13px)}
.stage[data-n="1"] .np{font-size:clamp(13px,3.2vw,18px);width:max(140%,150px);bottom:88%}
.np .n1{display:flex;justify-content:space-between;gap:4px;align-items:baseline;line-height:1.2}.np .mn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.np .lv{font-size:.85em;white-space:nowrap}
.np .n2{display:flex;align-items:center;gap:4px;margin-top:2px}.np .tpb{font-size:.7em;padding:0 6px;border-width:1.5px}.np .tag{font-size:.75em;padding:0 4px;line-height:1.5}
.stage:not([data-n="1"]) .np .tpb{display:none}
.np .hb{flex:1;height:.8em;min-height:7px}.np .hn{font-size:.85em;text-align:right;line-height:1.1}.np .xb{height:4px;margin-top:1px}
.who{position:absolute;left:-10px;top:-12px;background:var(--pc);color:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 7px;font-size:.85em;line-height:1.4;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fig.dodge{animation:dodge .55s}

 const imgGen=txt=>{const W=txt.trim().split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const f=l.split('|');return{w:f[0],em:f[1]}}),recent=[];
  const g=()=>{let it,k=0;do{it=pick(W)}while(recent.includes(it)&&++k<40);recent.push(it);if(recent.length>Math.min(8,W.length-1))recent.shift();
   const wr=shuf(W.filter(x=>x!==it&&x.w!==it.w)).slice(0,3).map(x=>x.w);return{text:`{{${it.em}}}`,ans:it.w,opts:shuf([it.w,...wr]),nw:true}};g.n=W.length;g.items=W;return g};
 const tx=txt=>{const b=bank(txt);const g=()=>Object.assign(b(),{nw:true});g.n=b.n;g.items=b.items;return g};
 const LV=['쉬움','보통','어려움'];

 const CATS=T.map(([id,name,icon,gens])=>({id,name,icon,st:gens.map((g,i)=>[LV[i],i+1,g])}));
 const ST={};CATS.forEach(c=>c.st.forEach((x,i)=>{const id=c.id+'_'+(i+1);ST[id]={id,cat:c,no:i+1,label:x[0],tier:x[1],gen:x[2],n:x[2].n}}));
 const PRE={};CATS.forEach(c=>{PRE[c.id]=c.st.map((_,i)=>c.id+'_'+(i+1))});
 PRE.easy=CATS.map(c=>c.id+'_1');PRE.mid=CATS.map(c=>c.id+'_2');PRE.hard=CATS.map(c=>c.id+'_3');PRE.all=Object.values(ST).map(s=>s.id);
 return {CATS,ST,PRE};
})();
